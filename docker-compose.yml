# RegLayer — Docker Compose (Local Development)
#
# WHY: Local dev needs PostgreSQL and Redis without manual installation.
# WHAT: Defines postgres (port 5432) and redis (port 6379) services with persistent volumes.
# HOW: Run "docker compose up -d" to start. Services match DATABASE_URL and REDIS_URL env vars.
#
# ---------------------------------------------------------
# RegLayer — Docker Compose
# ---------------------------------------------------------
# Infrastructure services for local development.
#
# Usage:
#   docker-compose up -d
#
# Services:
#   - PostgreSQL: Primary data store
#   - Redis: Queue backend (BullMQ)
#
# Future additions:
#   - OpenTelemetry collector
#   - Grafana dashboard
#   - OPA (Open Policy Agent)
# ---------------------------------------------------------

version: "3.8"

services:
  # -------------------------------------------------------
  # PostgreSQL — Primary Database
  # -------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: reglayer-postgres
    environment:
      POSTGRES_USER: reglayer
      POSTGRES_PASSWORD: reglayer_dev
      POSTGRES_DB: reglayer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reglayer"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # Redis — Queue Backend
  # -------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: reglayer-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
