# RegLayer — Dependabot Configuration
#
# WHY: Dependencies need regular updates for security patches and bug fixes.
# WHAT: Configures weekly PR creation for npm dependency updates.
# HOW: Dependabot checks for new versions weekly, creates PRs grouped by ecosystem.
#
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
