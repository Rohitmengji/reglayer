name: Bot Task Agent
on:
  issues:
    types: [opened, labeled]

# Prevent concurrent runs for the same issue
concurrency:
  group: bot-task-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  # ── Phase 1: AI generates changes, posts diff for human approval ────────
  generate-changes:
    if: |
      github.event.action == 'opened' &&
      contains(github.event.issue.labels.*.name, 'bot-task') &&
      !contains(github.event.issue.labels.*.name, 'approved') &&
      !contains(github.event.issue.labels.*.name, 'completed')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      # Security: extract task via env var, not shell interpolation
      - name: Extract task description
        id: task
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          DESC=$(echo "$ISSUE_BODY" | grep -oP '(?<=\*\*Description:\*\* ).*' || echo "$ISSUE_TITLE")
          # Sanitize: strip shell metacharacters, limit length
          DESC=$(echo "$DESC" | tr -d '`${}\\' | head -c 500)
          echo "description=$DESC" >> "$GITHUB_OUTPUT"

      - name: Comment — AI working
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '🤖 **AI Agent started** — analyzing codebase and generating changes...'
            });

      - name: Run AI Agent
        id: agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TASK_DESC: ${{ steps.task.outputs.description }}
        run: |
          node scripts/bot-agent.mjs "$TASK_DESC" > edits.json 2>agent.log
          cat agent.log >&2
          COUNT=$(node -e "const d=JSON.parse(require('fs').readFileSync('edits.json','utf8')); console.log((d.edits||d).length)")
          SUMMARY=$(node -e "const d=JSON.parse(require('fs').readFileSync('edits.json','utf8')); console.log(d.summary||'No summary')")
          echo "edits_count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY" > /tmp/ai_summary.txt

      - name: Preview edits (dry run)
        id: preview
        run: |
          # Apply to get summary without committing
          SUMMARY=$(node scripts/apply-edits.mjs edits.json)
          DIFF=$(git diff --stat && echo '---' && git diff --no-color | head -300)
          
          # Write to files to avoid shell escaping issues
          echo "$SUMMARY" > /tmp/summary.txt
          echo "$DIFF" > /tmp/diff.txt

      - name: Comment — changes ready for approval
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const aiSummary = fs.readFileSync('/tmp/ai_summary.txt', 'utf8').trim();
            const fileSummary = fs.readFileSync('/tmp/summary.txt', 'utf8');
            const diff = fs.readFileSync('/tmp/diff.txt', 'utf8');
            const count = '${{ steps.agent.outputs.edits_count }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '## 📋 Changes Ready for Review',
                '',
                '### What the AI did:',
                aiSummary,
                '',
                '---',
                '',
                `### Files changed (${count}):`,
                fileSummary,
                '',
                '<details><summary>View full diff</summary>',
                '',
                '```diff',
                diff.slice(0, 3000),
                '```',
                '</details>',
                '',
                '---',
                '✅ **To approve:** Add the `approved` label.',
                '❌ **To reject:** Close the issue.',
              ].join('\n')
            });

      - name: Comment — agent failed
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('agent.log') ? fs.readFileSync('agent.log', 'utf8').slice(0, 500) : 'No log';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **AI Agent failed**\n\n\`\`\`\n${log}\n\`\`\`\n\nClose and retry, or fix manually.`
            });

  # ── Phase 2: After approval, apply edits → run gates → create PR ────────
  apply-and-pr:
    if: |
      github.event.action == 'labeled' &&
      github.event.label.name == 'approved' &&
      contains(github.event.issue.labels.*.name, 'bot-task') &&
      !contains(github.event.issue.labels.*.name, 'completed')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Re-generate AI edits
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          DESC=$(echo "$ISSUE_BODY" | grep -oP '(?<=\*\*Description:\*\* ).*' || echo "$ISSUE_TITLE")
          DESC=$(echo "$DESC" | tr -d '`${}\\' | head -c 500)
          node scripts/bot-agent.mjs "$DESC" > edits.json

      - name: Apply edits
        run: node scripts/apply-edits.mjs edits.json

      - name: Check for actual changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment — no changes
        if: steps.changes.outputs.has_changes == 'false'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ **No changes detected** — AI edits produced no diff. Task may need clarification.'
            });

      - name: Comment — running gates
        if: steps.changes.outputs.has_changes == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⏳ **Running 3 gates** — tsc, vitest, build...'
            });

      - name: Gate 1 — TypeScript
        if: steps.changes.outputs.has_changes == 'true'
        run: npx tsc --noEmit

      - name: Gate 2 — Tests
        if: steps.changes.outputs.has_changes == 'true'
        run: npx vitest run

      - name: Gate 3 — Build
        if: steps.changes.outputs.has_changes == 'true'
        run: npx next build
        env:
          SKIP_ENV_VALIDATION: "1"

      - name: Create branch and PR
        if: steps.changes.outputs.has_changes == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          BRANCH="bot/issue-${ISSUE_NUMBER}"
          SAFE_TITLE=$(echo "$ISSUE_TITLE" | tr -d '`${}\\' | head -c 72)
          git config user.name "RegLayer Bot"
          git config user.email "bot@reglayer.dev"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "fix: ${SAFE_TITLE}

          Automated by RegLayer Bot from issue #${ISSUE_NUMBER}"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "fix: ${SAFE_TITLE}" \
            --body "Automated PR from Discord bot task #${ISSUE_NUMBER}.

          All 3 gates passed locally: tsc, vitest, build."

      - name: Comment — PR created
        if: steps.changes.outputs.has_changes == 'true' && success()
        uses: actions/github-script@v9
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
        with:
          script: |
            const num = process.env.ISSUE_NUM;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:bot/issue-${num}`,
              state: 'open'
            });
            const pr = prs.data[0];
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ **All 3 gates green!** PR created: #${pr?.number ?? '?'}\n\nReview and merge when ready.`
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              labels: ['bot-task', 'completed']
            });

      - name: Comment — gates failed
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `❌ **Gate failure** — AI changes broke a check.\n\n[View logs](${runUrl})\n\nRemove \`approved\` label to retry.`
            });
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, name: 'approved'
              });
            } catch {}
