# RegLayer — CodeQL Security Analysis
#
# WHY: Automated SAST (Static Application Security Testing) catches vulnerabilities in PRs.
# WHAT: Runs GitHub CodeQL analysis for JavaScript/TypeScript on push and weekly schedule.
# HOW: GitHub Advanced Security scans for injection, XSS, path traversal, hardcoded secrets.
#
name: CodeQL - Default

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  schedule:
    - cron: "21 11 * * 4"
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    if: github.actor != 'employ-automated-commit-app[bot]'
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libatomic1

      - name: Install nodejs
        uses: actions/setup-node@v4
        with:
          node-version: ">=20"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config-default.yml
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "language:${{ matrix.language }}"
