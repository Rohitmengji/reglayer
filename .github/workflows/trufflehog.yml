# RegLayer — TruffleHog Secret Scanning
#
# WHY: Prevents accidental commit of API keys, passwords, tokens to the repository.
# WHAT: Scans all commits in PR for high-entropy strings matching secret patterns.
# HOW: Uses trufflehog GitHub Action. Blocks PR if secrets detected. Runs on every push.
#
name: TruffleHog Secrets Scan

on:
  pull_request:

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --debug
