<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Modern Calculator</title>
<style>
  :root {
    --bg-grad: linear-gradient(135deg, #6a5cff 0%, #9b5cff 50%, #ff5c9b 100%);
    --surface: rgba(30, 30, 47, 0.72);
    --surface-border: rgba(255, 255, 255, 0.12);
    --btn: rgba(255, 255, 255, 0.06);
    --btn-hover: rgba(255, 255, 255, 0.14);
    --operator: rgba(122, 108, 255, 0.28);
    --accent: #8b7cff;
    --text: #f4f4fa;
    --muted: #9a9ab5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-grad);
    background-size: 200% 200%;
    animation: bgShift 18s ease infinite;
    padding: 20px;
  }
  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .calculator {
    width: 340px;
    background: var(--surface);
    backdrop-filter: blur(24px) saturate(160%);
    -webkit-backdrop-filter: blur(24px) saturate(160%);
    border: 1px solid var(--surface-border);
    border-radius: 28px;
    padding: 26px;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .display {
    position: relative;
    background: rgba(10, 10, 20, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 20px;
    padding: 22px 24px;
    margin-bottom: 22px;
    text-align: right;
    color: var(--text);
    min-height: 110px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .display .history {
    font-size: 16px;
    color: var(--muted);
    min-height: 22px;
    letter-spacing: 0.5px;
    word-break: break-all;
    transition: opacity 0.2s;
  }
  .display .current {
    font-size: 44px;
    font-weight: 600;
    letter-spacing: -0.5px;
    line-height: 1.1;
    word-break: break-all;
    transition: transform 0.12s ease;
  }
  .display .current.pop { transform: scale(1.06); }
  .buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  button {
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 18px;
    padding: 20px 0;
    font-size: 21px;
    font-weight: 500;
    color: var(--text);
    background: var(--btn);
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.08s ease, background 0.18s ease, box-shadow 0.18s ease;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: scale(0.94); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .operator {
    background: var(--operator);
    color: #cfc7ff;
    font-weight: 600;
  }
  .operator:hover { background: rgba(122, 108, 255, 0.42); }
  .operator.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 6px 18px rgba(139, 124, 255, 0.5);
  }
  .equals {
    background: linear-gradient(135deg, #7a6cff, #ff5c9b);
    font-weight: 700;
    box-shadow: 0 8px 22px rgba(122, 108, 255, 0.4);
  }
  .equals:hover { background: linear-gradient(135deg, #8b7cff, #ff6ca8); }
  .function { color: #ff9ab0; font-weight: 600; }
  .span-2 { grid-column: span 2; }
  .ripple {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.35);
    transform: scale(0);
    animation: ripple 0.5s ease-out;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(2.5); opacity: 0; } }
</style>
</head>
<body>
  <div class="calculator">
    <div class="display">
      <div class="history" id="history"></div>
      <div class="current" id="current">0</div>
    </div>
    <div class="buttons">
      <button class="function" data-action="clear">AC</button>
      <button class="function" data-action="delete">DEL</button>
      <button class="function" data-action="percent">%</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="span-2" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>
  </div>

  <script>
    const currentEl = document.getElementById("current");
    const historyEl = document.getElementById("history");
    const buttons = document.querySelector(".buttons");

    let current = "0";
    let previous = "";
    let operator = null;
    let resetNext = false;

    const symbols = { "/": "÷", "*": "×", "-": "−", "+": "+" };

    function updateDisplay() {
      currentEl.textContent = formatNumber(current);
      historyEl.textContent =
        previous !== "" && operator
          ? `${formatNumber(previous)} ${symbols[operator]}`
          : "";

      document
        .querySelectorAll(".operator")
        .forEach((b) => b.classList.toggle("active", b.dataset.value === operator && resetNext));

      currentEl.classList.remove("pop");
      void currentEl.offsetWidth;
      currentEl.classList.add("pop");
    }

    function formatNumber(str) {
      if (str === "" || str === "Error") return str || "0";
      const [intPart, decPart] = String(str).split(".");
      const sign = intPart.startsWith("-") ? "-" : "";
      const digits = sign ? intPart.slice(1) : intPart;
      const grouped = digits.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return sign + grouped + (decPart !== undefined ? "." + decPart : "");
    }

    function inputNumber(value) {
      if (resetNext) {
        current = "";
        resetNext = false;
      }
      if (value === "." && current.includes(".")) return;
      if (current === "0" && value !== ".") current = value;
      else current += value;
    }

    function chooseOperator(op) {
      if (operator && !resetNext) compute();
      previous = current;
      operator = op;
      resetNext = true;
    }

    function compute() {
      const a = parseFloat(previous);
      const b = parseFloat(current);
      if (isNaN(a) || isNaN(b)) return;
      let result;
      switch (operator) {
        case "+": result = a + b; break;
        case "-": result = a - b; break;
        case "*": result = a * b; break;
        case "/": result = b === 0 ? "Error" : a / b; break;
        default: return;
      }
      current = typeof result === "number"
        ? String(Math.round(result * 1e10) / 1e10)
        : result;
      operator = null;
      previous = "";
      resetNext = true;
    }

    function clearAll() {
      current = "0";
      previous = "";
      operator = null;
      resetNext = false;
    }

    function deleteLast() {
      if (resetNext) return;
      current = current.length > 1 ? current.slice(0, -1) : "0";
    }

    function percent() {
      current = String(parseFloat(current) / 100);
    }

    buttons.addEventListener("click", (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;
      const { value, action } = btn.dataset;

      if (value !== undefined) {
        if ("+-*/".includes(value)) chooseOperator(value);
        else inputNumber(value);
      } else if (action === "clear") clearAll();
      else if (action === "delete") deleteLast();
      else if (action === "percent") percent();
      else if (action === "equals") compute();

      createRipple(btn, e);
      updateDisplay();
    });

    function createRipple(btn, e) {
      const circle = document.createElement("span");
      const size = Math.max(btn.clientWidth, btn.clientHeight);
      const rect = btn.getBoundingClientRect();
      circle.style.width = circle.style.height = size + "px";
      circle.style.left = e.clientX - rect.left - size / 2 + "px";
      circle.style.top = e.clientY - rect.top - size / 2 + "px";
      circle.className = "ripple";
      btn.appendChild(circle);
      setTimeout(() => circle.remove(), 500);
    }

    document.addEventListener("keydown", (e) => {
      if (/[0-9.]/.test(e.key)) inputNumber(e.key);
      else if ("+-*/".includes(e.key)) chooseOperator(e.key);
      else if (e.key === "Enter" || e.key === "=") compute();
      else if (e.key === "Backspace") deleteLast();
      else if (e.key === "Escape") clearAll();
      else return;
      updateDisplay();
    });

    updateDisplay();
  </script>
</body>
</html>
